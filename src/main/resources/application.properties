spring.output.ansi.enabled=ALWAYS

# JWT — debe estar en application-dev.properties O application.properties
sisu.jwt.secret=SisuDevSecretKey2024DesarrolloLocalNoUsarEnProduccion!!
# 30 dias. La sesion del APK debe sobrevivir turnos, noches y fines de semana:
# antes duraba 8 h y el personal aparecia deslogueado sin haber cerrado sesion.
# Ademas el servicio nativo de GPS usa este mismo token, asi que al vencer dejaba
# de reportar ubicacion y el servidor lo contaba como "sin senal".
# Se puede acortar desde el servidor con SISU_JWT_EXPIRATION, sin recompilar.
sisu.jwt.expiration=${SISU_JWT_EXPIRATION:2592000000}
sisu.jwt.header=Authorization
sisu.jwt.prefix=Bearer

# Deshabilita la generación automática de CHECK constraints de Hibernate 6
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=BOOLEAN
spring.jpa.properties.hibernate.check_nullability=false


# ─── Almacenamiento local de archivos SISU ───────────────────
sisu.storage.path=C:/sisu-files
sisu.storage.base-url=/api/v1/files

# Para producción: crear application-prod.properties con:
# sisu.storage.path=/var/sisu-files

# ─── Notificaciones a grupo de Telegram (faltas, atrasos, pérdida de señal, etc.) ───
# Token y chat-id NO van acá (no se commitean). Se setean como variables de entorno
# en cada servidor antes de levantar el jar:
#   export SISU_TELEGRAM_BOT_TOKEN=xxxxx:yyyyy
#   export SISU_TELEGRAM_CHAT_ID=-100xxxxxxxxxx
# Si no están seteadas, el canal queda deshabilitado automáticamente (fail-soft).
sisu.telegram.enabled=${SISU_TELEGRAM_ENABLED:true}

# ─── Optimización N+1 (aplica a todo el sistema) ─────────────
spring.jpa.properties.hibernate.default_batch_fetch_size=50